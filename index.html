<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thiruvonam</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-12 -12 24 24'%3E%3Ccircle r='11' fill='%236b0f2a'/%3E%3Ccircle r='8' fill='%23f5b301'/%3E%3Ccircle r='5' fill='%232b8a3e'/%3E%3Ccircle r='2.5' fill='%23fff3bf'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+Malayalam:wght@500&display=swap" rel="stylesheet">
<style>
  /* ---------- Colour tokens ---------- */
  :root {
    --bg: #f8f1e4;
    --surface: #fffaf1;
    --surface-2: #f2e7d4;
    --text: #2a1a12;
    --muted: #7d6858;
    --line: #e8d9c0;
    --gold: #c9971f;
    --accent: #c2410c;
    --ok: #2b8a3e;
    --down: #c92a2a;
    --blob-1: rgba(240,140,0,.16);
    --blob-2: rgba(43,138,62,.12);
    --blob-3: rgba(194,37,92,.10);
    --shadow: 0 1px 2px rgba(60,30,10,.05), 0 18px 40px -24px rgba(60,30,10,.35);
    --display: "Cormorant Garamond", "Iowan Old Style", Palatino, Georgia, serif;
    --mal: "Noto Serif Malayalam", "Manjari", "Kartika", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #120d14; --surface: #1c1520; --surface-2: #2a2030; --text: #f6ecdb;
      --muted: #ab9a84; --line: #33283a; --gold: #e0b84e; --accent: #ff8a4c;
      --ok: #51cf66; --down: #ff6b6b;
      --blob-1: rgba(240,140,0,.12); --blob-2: rgba(43,138,62,.10); --blob-3: rgba(124,58,237,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 18px 40px -22px rgba(0,0,0,.8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #120d14; --surface: #1c1520; --surface-2: #2a2030; --text: #f6ecdb;
    --muted: #ab9a84; --line: #33283a; --gold: #e0b84e; --accent: #ff8a4c;
    --ok: #51cf66; --down: #ff6b6b;
    --blob-1: rgba(240,140,0,.12); --blob-2: rgba(43,138,62,.10); --blob-3: rgba(124,58,237,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 18px 40px -22px rgba(0,0,0,.8);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(40vw 40vw at 0% 0%, var(--blob-1), transparent 70%),
      radial-gradient(45vw 45vw at 100% 60%, var(--blob-2), transparent 70%),
      radial-gradient(35vw 35vw at 30% 100%, var(--blob-3), transparent 70%);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px 40px; }
  @media (min-width: 720px) { .wrap { padding: 28px 32px 56px; } }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden; isolation: isolate;
    border-radius: 28px; color: #fff6e5;
    padding: 22px 22px 48px; min-height: 420px;
    box-shadow: 0 30px 60px -30px rgba(40,10,20,.55);
    transition: background .8s;
  }
  @media (min-width: 720px) { .hero { padding: 30px 40px 56px; min-height: 400px; } }
  .hero[data-tod="morning"] { background: radial-gradient(90% 120% at 90% 50%, rgba(255,190,100,.55), transparent 60%), linear-gradient(135deg, #5c1428, #b23a2a 55%, #e8862d); }
  .hero[data-tod="day"]     { background: radial-gradient(90% 120% at 90% 50%, rgba(233,196,106,.40), transparent 60%), linear-gradient(135deg, #0a3530, #12634d 55%, #2c9468); }
  .hero[data-tod="evening"] { background: radial-gradient(90% 120% at 90% 50%, rgba(255,138,92,.45), transparent 60%), linear-gradient(135deg, #250c36, #74194a 55%, #cc5236); }
  .hero[data-tod="night"]   { background: radial-gradient(90% 120% at 90% 50%, rgba(124,92,231,.40), transparent 60%), linear-gradient(135deg, #0a0c26, #1c1550 55%, #3b2270); }

  /* kasavu border — the gold bands of a Kerala sari */
  .hero::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 16px; height: 10px; z-index: 1;
    background: linear-gradient(to bottom,
      #f3d27a 0 3px, transparent 3px 5px, #e9b949 5px 6px, transparent 6px 8px, #f3d27a 8px 10px);
    opacity: .9;
  }

  .stars { position: absolute; inset: 0; z-index: -2; pointer-events: none; }
  .stars span { position: absolute; border-radius: 50%; background: #fff; animation: twinkle 4s ease-in-out infinite; }
  .hero:not([data-tod="night"]):not([data-tod="evening"]) .stars { display: none; }
  @keyframes twinkle { 50% { opacity: .25; } }

  .pookalam-wrap {
    position: absolute; z-index: -1; pointer-events: none;
    width: 300px; height: 300px; right: -150px; top: -110px; opacity: .45;
    filter: drop-shadow(0 24px 40px rgba(0,0,0,.35));
  }
  .pookalam-wrap svg { width: 100%; height: 100%; display: block; }
  @media (min-width: 720px) {
    .pookalam-wrap { width: 470px; height: 470px; right: -70px; top: 50%; translate: 0 -50%; opacity: 1; }
  }
  @media (min-width: 720px) and (max-width: 1000px) { .pookalam-wrap { right: -170px; opacity: .8; } }

  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .eyebrow { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #f3d27a; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .eyebrow::before { content: ""; width: 28px; height: 2px; background: #f3d27a; border-radius: 2px; }
  .glass-btn {
    width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; cursor: pointer;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff6e5;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: background .2s, transform .2s;
  }
  .glass-btn:hover { background: rgba(255,255,255,.22); transform: rotate(20deg); }
  .glass-btn svg { width: 19px; height: 19px; }

  .hero-body { margin-top: 34px; max-width: 620px; }
  @media (min-width: 720px) { .hero-body { margin-top: 44px; } }
  .mal { font-family: var(--mal); font-size: 19px; color: #f3d27a; margin: 0 0 2px; }
  .house {
    font-family: var(--display); font-weight: 600; margin: 0;
    font-size: clamp(58px, 11vw, 112px); line-height: .9; letter-spacing: -.01em;
    background: linear-gradient(180deg, #fffaf0 30%, #f3d27a); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 2px 30px rgba(0,0,0,.15);
  }
  .greet { font-family: var(--display); font-style: italic; font-size: clamp(20px, 3vw, 26px); margin: 12px 0 0; opacity: .95; }

  .clock-row { display: flex; align-items: center; gap: 16px; margin-top: 26px; }
  .clock { font-family: var(--display); font-weight: 600; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 559px) { .clock { font-size: 38px; } .clock-row { gap: 12px; } }
  .clock-row .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.3); }
  .date { font-size: 14px; line-height: 1.35; opacity: .9; }
  .date b { display: block; font-weight: 600; font-size: 15px; }

  .chips-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .gchip {
    display: inline-flex; align-items: center; gap: 9px; padding: 7px 14px 7px 8px; border-radius: 999px; font-size: 13px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .gchip .gi { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.16); }
  .gchip .gi svg { width: 14px; height: 14px; }
  .ring { width: 26px; height: 26px; rotate: -90deg; }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .track { stroke: rgba(255,255,255,.22); }
  .ring .val { stroke: #8ce99a; stroke-linecap: round; transition: stroke-dasharray .8s ease; }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 28px 0 8px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; max-width: 100%; }
  .filters::-webkit-scrollbar { display: none; }
  .fchip {
    --fc: var(--accent);
    flex: none; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    font: 600 13.5px var(--sans); color: var(--text); padding: 9px 16px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); transition: all .2s;
  }
  .fchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--fc); }
  .fchip:hover { border-color: var(--fc); }
  .fchip.on { background: var(--fc); color: #fff; border-color: transparent; box-shadow: 0 8px 20px -10px var(--fc); }
  .fchip.on i { background: #fff; }

  .search { position: relative; flex: 1 1 260px; }
  .search svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; font: inherit; font-size: 16px; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 12px 50px 12px 44px; outline: none; box-shadow: var(--shadow); transition: border-color .2s, box-shadow .2s;
  }
  .search input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 20%, transparent); }
  .search input::placeholder { color: var(--muted); }
  .search kbd {
    position: absolute; right: 14px; top: 50%; translate: 0 -50%;
    font: 12px var(--sans); color: var(--muted); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 7px; background: var(--surface-2);
  }
  @media (hover: none) { .search kbd { display: none; } }

  /* ---------- Sections ---------- */
  .sec { margin-top: 34px; }
  .sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .sec-ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--sc); background: color-mix(in srgb, var(--sc) 15%, transparent); }
  .sec-ico svg { width: 22px; height: 22px; }
  .sec-head h2 { font-family: var(--display); font-weight: 600; font-size: 28px; margin: 0; line-height: 1; }
  .sec-head .count { font-size: 12px; font-weight: 600; color: var(--sc); background: color-mix(in srgb, var(--sc) 13%, transparent); padding: 3px 9px; border-radius: 999px; }
  .sec-head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to right, color-mix(in srgb, var(--sc) 50%, var(--line)), transparent); }

  .feat-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); margin-bottom: 16px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  @media (max-width: 559px) { .grid { grid-template-columns: 1fr 1fr; gap: 12px; } }

  /* Featured cards */
  .feat {
    position: relative; overflow: hidden; isolation: isolate;
    display: flex; flex-direction: column; justify-content: space-between; gap: 26px;
    min-height: 180px; padding: 22px; border-radius: 24px; color: #fff; text-decoration: none;
    background: linear-gradient(140deg, var(--c1), var(--c2));
    box-shadow: 0 22px 40px -24px var(--c2);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .feat::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(70% 90% at 0% 0%, rgba(255,255,255,.35), transparent 60%),
                radial-gradient(40% 50% at 100% 100%, rgba(0,0,0,.18), transparent 70%);
  }
  .feat .wm { position: absolute; right: -24px; bottom: -34px; width: 180px; height: 180px; opacity: .2; z-index: -1; rotate: -12deg; transition: rotate .4s ease, scale .4s ease; }
  .feat:hover, .feat:focus-visible { transform: translateY(-5px); box-shadow: 0 30px 50px -24px var(--c2); outline: none; }
  .feat:hover .wm { rotate: -4deg; scale: 1.08; }
  .feat-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .big-ico { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(6px); }
  .big-ico svg { width: 28px; height: 28px; }
  .feat-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .feat .name { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1; }
  .feat .desc { font-size: 14px; opacity: .88; margin-top: 4px; }
  .arrow { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.95); color: var(--c2); transition: transform .25s; }
  .arrow svg { width: 18px; height: 18px; }
  .feat:hover .arrow { transform: translateX(4px); }

  /* Regular tiles */
  .tile {
    position: relative; overflow: hidden; isolation: isolate;
    display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
    min-height: 150px; padding: 18px; border-radius: 22px; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    transition: transform .25s ease, border-color .25s, box-shadow .25s;
  }
  .tile::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: linear-gradient(90deg, var(--c1), var(--c2)); transform: scaleX(0); transform-origin: left; transition: transform .35s ease;
  }
  .tile .wm { position: absolute; right: -20px; bottom: -24px; width: 116px; height: 116px; color: var(--c2); opacity: .07; z-index: -1; rotate: -10deg; }
  .tile:hover, .tile:focus-visible {
    transform: translateY(-4px); outline: none;
    border-color: color-mix(in srgb, var(--c1) 55%, var(--line));
    box-shadow: 0 22px 40px -26px var(--c2);
  }
  .tile:hover::after, .tile:focus-visible::after { transform: scaleX(1); }
  .tile-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .ico {
    width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; color: #fff;
    background: linear-gradient(140deg, var(--c1), var(--c2));
    box-shadow: 0 10px 20px -10px var(--c2), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .3s ease;
  }
  .ico svg { width: 24px; height: 24px; }
  .tile:hover .ico { transform: rotate(-8deg) scale(1.06); }
  .tile .name { font-weight: 650; font-size: 16px; }
  .tile .desc { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* Status pills */
  .pill { display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px var(--sans); padding: 4px 10px 4px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.up { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .pill.up i { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .pill.down { color: var(--down); background: color-mix(in srgb, var(--down) 12%, transparent); }
  .feat .pill { background: rgba(255,255,255,.2); color: #fff; backdrop-filter: blur(6px); }
  .feat .pill.up i { background: #b2f2bb; box-shadow: 0 0 0 3px rgba(178,242,187,.3); }
  .feat .pill.down i { background: #ffc9c9; }
  @media (max-width: 559px) { .tile .pill b { display: none; } .tile .pill { padding: 5px; } }

  .empty { text-align: center; color: var(--muted); padding: 50px 0 20px; font-family: var(--display); font-size: 22px; font-style: italic; }

  footer { margin-top: 56px; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; text-align: center; }
  footer .mini { width: 44px; height: 44px; }
  footer .fname { font-family: var(--display); font-size: 22px; color: var(--text); font-weight: 600; }
  footer b { color: var(--text); font-weight: 600; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .feat, .tile { animation: rise .55s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(var(--i) * 45ms); }

  @media (prefers-reduced-motion: reduce) {
    .feat, .tile, .stars span { animation: none; }
    .feat, .tile, .ico, .wm, .arrow, .glass-btn { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero" id="hero" data-tod="day">
    <div class="stars" id="stars"></div>
    <div class="pookalam-wrap" id="pookalam"></div>

    <div class="hero-top">
      <div class="eyebrow">Home server</div>
      <button class="glass-btn" id="themeBtn" aria-label="Toggle light and dark theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <div class="hero-body">
      <p class="mal" id="houseLocal">തിരുവോണം</p>
      <h1 class="house" id="houseName">Thiruvonam</h1>
      <p class="greet" id="greet">Welcome home.</p>

      <div class="clock-row">
        <div class="clock" id="clock">--:--</div>
        <span class="sep"></span>
        <div class="date" id="date"></div>
      </div>

      <div class="chips-row">
        <span class="gchip" id="statusChip">
          <svg class="ring" viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15.9155"/><circle class="val" id="ringVal" cx="18" cy="18" r="15.9155" stroke-dasharray="0 100"/></svg>
          <span id="statusText">Checking services…</span>
        </span>
        <span class="gchip">
          <span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></span>
          <span id="hostLabel"></span>
        </span>
        <span class="gchip">
          <span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span>
          <span id="appCount"></span>
        </span>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="filters" id="filters" role="tablist" aria-label="Filter apps"></div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Find an app…" autocomplete="off" aria-label="Search apps">
      <kbd>/</kbd>
    </label>
  </div>

  <main id="apps"></main>
  <p class="empty" id="empty" hidden>Nothing here by that name.</p>

  <footer>
    <div id="miniPookalam"></div>
    <div class="fname" id="footName">Thiruvonam</div>
    <div>Press <b>/</b> to search · <b>Enter</b> opens the first match · <b>Esc</b> clears</div>
  </footer>
</div>

<script>
/* ============================================================
   EDIT THIS SECTION to match your server
   ------------------------------------------------------------
   url can be:
     ":8080"            -> same machine, different port
     "/photos"          -> a path on this server (reverse proxy)
     "https://x.y.z"    -> any full address
   icon:     one of the names in ICONS below
   colors:   two colours for the tile's gradient
   featured: true makes it a large card at the top of its section
   ============================================================ */
const CONFIG = {
  houseName: "Thiruvonam",
  houseNameLocal: "തിരുവോണം",
  fallbackHost: "thiruvonam.local",  // used if you open this file directly from disk
  openInNewTab: false,
  checkStatus: true,
  sections: [
    {
      title: "Everyday", color: "#e8590c",
      apps: [
        { name: "Files",     desc: "Storage & sharing",       url: ":8081", icon: "folder",   colors: ["#4dabf7", "#1c4fa8"], featured: true },
        { name: "Photos",    desc: "Albums & family memories", url: ":2283", icon: "image",    colors: ["#ffa94d", "#d6336c"], featured: true },
        { name: "Media",     desc: "Movies & TV",             url: ":8096", icon: "play",     colors: ["#b197fc", "#5f3dc4"], featured: true },
        { name: "Music",     desc: "Your library",            url: ":4533", icon: "music",    colors: ["#f783ac", "#a61e4d"] },
        { name: "Documents", desc: "Scanned papers & search", url: ":8000", icon: "doc",      colors: ["#38d9a9", "#087f5b"] },
        { name: "Notes",     desc: "Notes & to-dos",          url: ":3010", icon: "pen",      colors: ["#ffd43b", "#e67700"] },
      ]
    },
    {
      title: "Home", color: "#2b8a3e",
      apps: [
        { name: "Calendar",       desc: "Shared family calendar",  url: ":5232", icon: "calendar", colors: ["#74c0fc", "#3b5bdb"] },
        { name: "Home Assistant", desc: "Lights, sensors, scenes", url: ":8123", icon: "home",     colors: ["#3bc9db", "#0b7285"] },
        { name: "Downloads",      desc: "Download queue",          url: ":8082", icon: "download", colors: ["#8ce99a", "#2b8a3e"] },
        { name: "Passwords",      desc: "Password vault",          url: ":8222", icon: "lock",     colors: ["#adb5bd", "#3d4451"] },
      ]
    },
    {
      title: "System", color: "#7048e8",
      apps: [
        { name: "Containers", desc: "Manage running services", url: ":9000", icon: "box",      colors: ["#91a7ff", "#364fc7"] },
        { name: "Monitoring", desc: "CPU, disk & uptime",      url: ":3001", icon: "activity", colors: ["#ff8787", "#c92a2a"] },
        { name: "Ad Blocker", desc: "Network-wide DNS",        url: ":8053", icon: "shield",   colors: ["#c0eb75", "#5c940d"] },
        { name: "Backups",    desc: "Snapshots & restores",    url: ":8200", icon: "archive",  colors: ["#f2c27b", "#9a5b1e"] },

      ]
    }

};

/* ---------- Icons (inline, no external downloads) ---------- */
const ICONS = {
  folder:   '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  image:    '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
  play:     '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/>',
  music:    '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  doc:      '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  pen:      '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  home:     '<path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  lock:     '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  box:      '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  shield:   '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  archive:  '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/>',
  router:   '<rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 17h.01M11 17h.01M8.5 10.5a5 5 0 0 1 7 0M5.5 7.5a9 9 0 0 1 13 0"/>',
  globe:    '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'
};
const svg = (name, cls = "", sw = 1.9) =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.globe}</svg>`;
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const FLOWER = `<svg viewBox="-12 -12 24 24" aria-hidden="true">${[...Array(8)].map((_, i) =>
  `<ellipse cx="0" cy="-6" rx="2.6" ry="4.8" transform="rotate(${i * 45})" fill="currentColor" opacity=".85"/>`).join("")}<circle r="2.8" fill="var(--gold)"/></svg>`;

/* ---------- Pookalam (Onam flower carpet), drawn in code ---------- */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function pookalam(animate) {
  const bands = [
    { disc: 178, dc: "#6b0f2a", n: 36, r: 160, len: 30, w: 13, pc: "#f08c00" },
    { disc: 142, dc: "#f5b301", n: 30, r: 127, len: 25, w: 11, pc: "#c2255c" },
    { disc: 112, dc: "#2b8a3e", n: 24, r: 99,  len: 21, w: 10, pc: "#fff3bf" },
    { disc: 86,  dc: "#fff3bf", n: 20, r: 74,  len: 18, w: 9,  pc: "#e8590c" },
    { disc: 62,  dc: "#5f3dc4", n: 16, r: 51,  len: 15, w: 8,  pc: "#ffd43b" },
    { disc: 40,  dc: "#c92a2a", n: 12, r: 31,  len: 11, w: 6,  pc: "#fff8e7" },
  ];
  let s = `<svg viewBox="-184 -184 368 368" aria-hidden="true"><circle r="181" fill="none" stroke="#f3d27a" stroke-width="3"/>`;
  bands.forEach((b, i) => {
    s += `<circle r="${b.disc}" fill="${b.dc}"/><g>`;
    const step = 360 / b.n;
    for (let k = 0; k < b.n; k++) {
      s += `<ellipse cx="0" cy="${-b.r}" rx="${b.w / 2}" ry="${b.len / 2}" fill="${b.pc}" transform="rotate(${k * step})"/>`;
      s += `<circle cx="0" cy="${-b.r}" r="${b.w * .18}" fill="${b.dc}" opacity=".55" transform="rotate(${k * step})"/>`;
    }
    if (animate) {
      const dir = i % 2 ? -360 : 360;
      s += `<animateTransform attributeName="transform" type="rotate" from="0 0 0" to="${dir} 0 0" dur="${140 + i * 35}s" repeatCount="indefinite"/>`;
    }
    s += `</g>`;
  });
  s += `<circle r="20" fill="#fcc419"/><circle r="12" fill="#e8590c"/><circle r="5" fill="#fff3bf"/></svg>`;
  return s;
}
document.getElementById("pookalam").innerHTML = pookalam(!reduceMotion);
document.getElementById("miniPookalam").innerHTML = pookalam(false).replace("<svg ", '<svg class="mini" ');

/* ---------- Stars for evening & night ---------- */
(() => {
  const box = document.getElementById("stars");
  let html = "";
  for (let i = 0; i < 55; i++) {
    const size = Math.random() < .15 ? 3 : Math.random() < .5 ? 2 : 1.2;
    html += `<span style="left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 85).toFixed(1)}%;width:${size}px;height:${size}px;opacity:${(.4 + Math.random() * .6).toFixed(2)};animation-delay:${(Math.random() * 4).toFixed(2)}s"></span>`;
  }
  box.innerHTML = html;
})();

/* ---------- Helpers ---------- */
const host = location.hostname || CONFIG.fallbackHost;
const proto = location.protocol.startsWith("http") ? location.protocol : "http:";
function resolve(url) {
  if (url.startsWith(":")) return `${proto}//${host}${url}`;
  if (url.startsWith("/")) return location.hostname ? url : `${proto}//${host}${url}`;
  return url;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- Render ---------- */
document.title = CONFIG.houseName;
document.getElementById("houseName").textContent = CONFIG.houseName;
document.getElementById("footName").textContent = CONFIG.houseName;
document.getElementById("houseLocal").textContent = CONFIG.houseNameLocal || "";
document.getElementById("hostLabel").textContent = host;
const totalApps = CONFIG.sections.reduce((n, s) => n + s.apps.length, 0);
document.getElementById("appCount").textContent = `${totalApps} apps`;

const target = CONFIG.openInNewTab ? ' target="_blank" rel="noopener"' : "";
const pill = CONFIG.checkStatus ? '<span class="pill"><i></i><b>Checking</b></span>' : "";
let order = 0;
function card(a, big) {
  const [c1, c2] = a.colors || ["#f08c00", "#c2410c"];
  const attrs = `href="${esc(resolve(a.url))}"${target} style="--c1:${esc(c1)};--c2:${esc(c2)};--i:${order++}" data-search="${esc((a.name + " " + (a.desc || "")).toLowerCase())}"`;
  if (big) return `
    <a class="feat" ${attrs}>
      ${svg(a.icon, "wm", 1.4)}
      <div class="feat-top"><span class="big-ico">${svg(a.icon)}</span>${pill}</div>
      <div class="feat-bottom">
        <div><div class="name">${esc(a.name)}</div><div class="desc">${esc(a.desc || "")}</div></div>
        <span class="arrow">${ARROW}</span>
      </div>
    </a>`;
  return `
    <a class="tile" ${attrs}>
      ${svg(a.icon, "wm", 1.4)}
      <div class="tile-top"><span class="ico">${svg(a.icon)}</span>${pill}</div>
      <div><div class="name">${esc(a.name)}</div><div class="desc">${esc(a.desc || "")}</div></div>
    </a>`;
}
document.getElementById("apps").innerHTML = CONFIG.sections.map((sec, si) => {
  const feat = sec.apps.filter(a => a.featured), rest = sec.apps.filter(a => !a.featured);
  return `
    <section class="sec" data-sec="${si}" style="--sc:${esc(sec.color || "var(--accent)")}">
      <div class="sec-head"><span class="sec-ico">${FLOWER}</span><h2>${esc(sec.title)}</h2><span class="count">${sec.apps.length}</span></div>
      ${feat.length ? `<div class="feat-grid">${feat.map(a => card(a, true)).join("")}</div>` : ""}
      ${rest.length ? `<div class="grid">${rest.map(a => card(a, false)).join("")}</div>` : ""}
    </section>`;
}).join("");

/* ---------- Filters & search ---------- */
let active = "all";
const filtersEl = document.getElementById("filters");
filtersEl.innerHTML =
  `<button class="fchip on" data-f="all" style="--fc:var(--accent)"><i></i>All</button>` +
  CONFIG.sections.map((s, i) => `<button class="fchip" data-f="${i}" style="--fc:${esc(s.color || "var(--accent)")}"><i></i>${esc(s.title)}</button>`).join("");
filtersEl.addEventListener("click", e => {
  const b = e.target.closest(".fchip"); if (!b) return;
  active = b.dataset.f;
  filtersEl.querySelectorAll(".fchip").forEach(c => c.classList.toggle("on", c === b));
  apply();
});

const q = document.getElementById("q");
function apply() {
  const term = q.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".sec").forEach(sec => {
    const inCat = active === "all" || sec.dataset.sec === active;
    let any = 0;
    sec.querySelectorAll(".feat, .tile").forEach(t => {
      const hit = inCat && (!term || t.dataset.search.includes(term));
      t.hidden = !hit; if (hit) any++;
    });
    sec.querySelectorAll(".feat-grid, .grid").forEach(g => g.hidden = ![...g.children].some(c => !c.hidden));
    sec.hidden = !any; shown += any;
  });
  document.getElementById("empty").hidden = shown > 0;
}
q.addEventListener("input", apply);
q.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const first = [...document.querySelectorAll(".feat, .tile")].find(t => !t.hidden);
    if (first) first.click();
  } else if (e.key === "Escape") { q.value = ""; apply(); q.blur(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});

/* ---------- Clock, greeting & sky ---------- */
function tick() {
  const now = new Date(), h = now.getHours();
  const greet = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  const tod = h < 5 ? "night" : h < 11 ? "morning" : h < 16 ? "day" : h < 19 ? "evening" : "night";
  document.getElementById("hero").dataset.tod = tod;
  document.getElementById("greet").textContent = `${greet} — welcome home.`;
  document.getElementById("clock").textContent = now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  document.getElementById("date").innerHTML =
    `<b>${now.toLocaleDateString(undefined, { weekday: "long" })}</b>${now.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" })}`;
}
tick(); setInterval(tick, 10000);

/* ---------- Theme ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem("thiruvonam-theme"); if (t) root.dataset.theme = t; } catch (_) {}
document.getElementById("themeBtn").addEventListener("click", () => {
  const isDark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = isDark ? "light" : "dark";
  try { localStorage.setItem("thiruvonam-theme", root.dataset.theme); } catch (_) {}
});

/* ---------- Status checks ---------- */
async function ping(url, ms = 4000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try { await fetch(url, { mode: "no-cors", cache: "no-store", signal: ctrl.signal }); return true; }
  catch (_) { return false; }
  finally { clearTimeout(timer); }
}
async function checkAll() {
  const cards = [...document.querySelectorAll(".feat, .tile")];
  const results = await Promise.all(cards.map(async c => {
    const up = await ping(c.href);
    const p = c.querySelector(".pill");
    p.className = "pill " + (up ? "up" : "down");
    p.querySelector("b").textContent = up ? "Online" : "Offline";
    p.title = up ? "Online" : "Not responding";
    return up;
  }));
  const n = results.filter(Boolean).length;
  document.getElementById("ringVal").setAttribute("stroke-dasharray", `${(n / results.length * 100).toFixed(1)} 100`);
  document.getElementById("statusText").textContent = `${n} of ${results.length} services online`;
}
if (CONFIG.checkStatus) { checkAll(); setInterval(checkAll, 60000); }
else document.getElementById("statusChip").hidden = true;
</script>
